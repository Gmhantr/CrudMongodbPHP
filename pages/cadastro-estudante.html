<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casdastro</title>
</head>
<body>
    <form action="">
        <fieldset>

        <fieldset>
        <legend>Dados Pessoais</legend>


        <label for="name">Nome Completo</label>
        <input type="text" placeholder="Digite seu nome" id="name" name="name" required>

        <label for="email"</label>
        <input type="email " placeholder="Digite seu email" id="email" name="email" required>

        <label for="cpf">CPF</label>
        <input type="text" placeholder="000.000.000-00" id="cpf" name="cpf" required>

        <label for="celular">Celular</label>
        <input type="text" placeholder="(00)00000-0000" id="celular" name="celular" required>

        <label for="date">Data de nascimento</label>
        <input type="date" placeholder="Data nascimento" id="date" name="date" required>

        
        
        </fieldset>

        <fieldset>


        </fieldset>

        <br>
         
        <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000" required>

        <label for="rua">Rua</label>
        <input type="text" id="rua" name="rua" placeholder="rua" required>

        <label for="numero">Número</label> 
        <input type="number" id="numero" name="numero" placeholder="numero" required>

        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro" placeholder="bairro" required>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" placeholder="cidade required>

        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="PR">Paraná</option>
            <option value="SP">São Paulo</option>
            <option value="SC">Santa Catarina</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="GO">Goiás</option>
        </select>

        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" placeholder="complemento" required>




        </fieldset>
        </fieldset>
        <br>

        <button type="submit" >Cadastrar Estudante</button>
    </form >
</body>
</html>
