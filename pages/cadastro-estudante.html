
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../index.css">

    <title>Cadastro de Estudantes</title>
</head>
<body>

    <main class="container">

        <section class="formulario">

            <div class="titulo">
                <h1>Cadastro de Estudante</h1>
                <p>Preencha os dados para cadastrar um novo estudante.</p>
            </div>

            <form action="../php/estudante/create.php" method="POST">

                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <div class="campos">

                        <div class="campo">
                            <label for="name">Nome Completo</label>
                            <input type="text" id="name" name="name"
                                placeholder="Digite seu nome" required>
                        </div>

                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email"
                                placeholder="Digite seu e-mail" required>
                        </div>

                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf"
                                placeholder="000.000.000-00" required>
                        </div>

                        <div class="campo">
                            <label for="celular">Celular</label>
                            <input type="text" id="celular" name="celular"
                                placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="campo">
                            <label for="date">Data de nascimento</label>
                            <input type="date" id="date" name="date" required>
                        </div>

                    </div>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <div class="campos">

                        <div class="campo">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep"
                                placeholder="00000-000" required>
                        </div>

                        <div class="campo">
                            <label for="rua">Rua</label>
                            <input type="text" id="rua" name="rua"
                                placeholder="Digite sua rua" required>
                        </div>

                        <div class="campo">
                            <label for="numero">Número</label>
                            <input type="number" id="numero" name="numero"
                                placeholder="Número" required>
                        </div>

                        <div class="campo">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro"
                                placeholder="Digite seu bairro" required>
                        </div>

                        <div class="campo">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade"
                                placeholder="Digite sua cidade" required>
                        </div>

                        <div class="campo">
                            <label for="estado">Estado</label>
                            <select id="estado" name="estado" required>
                                <option value="">Selecione</option>
                                <option value="PR">Paraná</option>
                                <option value="SP">São Paulo</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="GO">Goiás</option>
                            </select>
                        </div>

                        <div class="campo campo-completo">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento"
                                name="complemento"
                                placeholder="Apartamento, bloco, etc.">
                        </div>

                    </div>
                </fieldset>

                <button type="submit">Cadastrar Estudante</button>

            </form>

        </section>

        <section class="estudantes">
            <h2>Estudantes cadastrados</h2>
            <div id="lista-estudantes"></div>
        </section>

    </main>

    <script src="../js/estudantes.js"></script>

</body>
</html>
